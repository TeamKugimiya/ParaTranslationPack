[project]
name = "paratranslationpack"
version = "1.0"
description = ""
authors = [
    {name = "Miku", email = "26039249+xMikux@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13 <4.0"
dependencies = [
    "paratranz-py @ git+https://github.com/TeamKugimiya/paratranz-py.git",
    "loguru (>=0.7.3,<0.8.0)",
    "flake8 (>=7.1.2,<8.0.0)",
    "pytz (>=2025.1,<2026.0)",
    "jsonschema (>=4.23.0,<5.0.0)",
    "discord-webhook (>=1.3.1,<2.0.0)"
]

[tool.poetry]
packages = [
    { include = "scripts" }
]

[project.scripts]
para_cache_id = "scripts.paratranz.para_cache_id:run"
modrinth_verify_publish = "scripts.modrinth.modrinth_verify_publish:run"
para_build = "scripts.paratranz.para_build:run"
github_matrix = "scripts.github.matrix:run"
webhook_update = "scripts.discord.webhook:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
