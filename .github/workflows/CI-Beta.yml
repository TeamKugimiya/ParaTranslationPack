name: CI | Beta Release

on: [ push ]

jobs:
  cache:
    uses: ./.github/workflows/reusable-cache.yml
    with:
      cache_key: beta-cache
    secrets:
      PARATRANZ_API_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: [ cache ]
    if: ${{ needs.cache.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Hello world
        run: echo "Hello world and cache status is ${{ needs.cache.outputs.cache-hit }}"