name: Reusable | Para Build

on: 
  workflow_call:
    inputs:
      mc_version:
        description: "Build Minecraft version"
        required: true
        type: string
      pack_format:
        description: "The pack format version"
        type: number
        required: true
      pack_supported_format_min:
        description: "The minimum supported pack format version"
        type: number
        required: true
      pack_supported_format_max:
        description: "The maximum supported pack format version"
        type: number
        required: true
    secrets:
      PARATRANZ_TOKEN:
        description: "ParaTranz API Token"
        required: true

env:
  LOGURU_LEVEL: "INFO"
  PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
  MC_PACK_FORMAT: ${{ inputs.pack_format }}
  MC_SUPPORTED_FORMAT_MIN: ${{ inputs.pack_supported_format_min }}
  MC_SUPPORTED_FORMAT_MAX: ${{ inputs.pack_supported_format_max }}

jobs:
  para_build:
    name: Para Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version-file: ".python-version"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5.3.0
        with:
          enable-cache: true

      - name: Build Para ResourcePack
        id: gh_matrix
        run: |
          uv run para_build

      - name: PackUp PackSquash
        uses: ComunidadAylas/PackSquash-action@v4.0.3
        with:
          packsquash_version: latest-unstable
          artifact_name: ParaTranslationPack-${{ inputs.mc_version }}
          options: |
            pack_directory = 'workdir'
            zip_spec_conformance_level = 'high'
            ['LICENSE']
            force_include = true
