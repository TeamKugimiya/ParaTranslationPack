name: CI | Release

on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 16 * * *"

jobs:
  modrinth_verify:
    name: Step 0 | Modrinth
    uses: ./.github/workflows/reusable-modrinth_verify.yml

  para_cache:
    name: Step 0 | Cache
    uses: ./.github/workflows/reusable-cache.yml
    with:
      cache_key: release-cache
    secrets:
      PARATRANZ_API_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}

  github_matrix:
    name: Step 1 | GitHub Matrix
    needs: [ modrinth_verify, para_cache ]
    if: ${{ needs.para_cache.outputs.cache-hit != 'true' && needs.modrinth_verify.outputs.is-same-date != 'true' }}
    uses: ./.github/workflows/reusable-github_matrix.yml

  para_modrinth_summary:
    name: Step 1 | Modrinth Summary
    needs: [ modrinth_verify, para_cache ]
    if: ${{ needs.para_cache.outputs.cache-hit != 'true' && needs.modrinth_verify.outputs.is-same-date != 'true' }}
    uses: ./.github/workflows/reusable-modrinth_summary.yml
    secrets:
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}

  para_paraify:
    name: Step 2 | Paraify Build ${{ matrix.mc_version }}
    needs: [ github_matrix ]
    strategy:
      matrix: ${{ fromJson(needs.github_matrix.outputs.matrix-data) }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      mc_version: ${{ matrix.mc_version }}
      pack_format: ${{ matrix.mc_pack_format }}
      pack_supported_format_min: ${{ matrix.mc_supported_formats_min }}
      pack_supported_format_max: ${{ matrix.mc_supported_formats_max }}
    secrets:
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}

  para_modrinth_publish:
    name: Step 3 | Modrinth Publish
    needs: [ para_paraify, para_modrinth_summary, github_matrix ]
    strategy:
      max-parallel: 1
      matrix: ${{ fromJson(needs.github_matrix.outputs.matrix-data) }}
    uses: ./.github/workflows/reusable-modrinth_publish.yml
    with:
      mc_version: ${{ matrix.mc_version }}
      modrinth_game_version: ${{ matrix.mc_game_version }}
      modrinth_summary: ${{ needs.para_modrinth_summary.outputs.modrinth-summary }}
    secrets:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
